[build]
  publish = "."
  command = ""

[build.processing.html]
  pretty_urls = true

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirect Netlify subdomain to canonical custom domain (301 permanent)
[[redirects]]
  from = "https://theaureumlistai.netlify.app/*"
  to = "https://theaureumlistai.com/:splat"
  status = 301
  force = true

# Force trailing-slash removal for consistency (extensionless URLs without trailing slash)
[[redirects]]
  from = "/articles/elite-credit-cards-guide/"
  to = "/articles/elite-credit-cards-guide"
  status = 301

[[redirects]]
  from = "/articles/executive-protection-guide/"
  to = "/articles/executive-protection-guide"
  status = 301

