  status = 301

[[redirects]]
  from = "/articles/luxury-timepieces-guide/"
  to = "/articles/luxury-timepieces-guide"
  status = 301

[[redirects]]
  from = "/articles/private-aviation-guide/"
  to = "/articles/private-aviation-guide"
